name: Build and attest release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build immutable release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      release_artifact_id: ${{ steps.release_artifact.outputs.artifact-id }}
      release_sha: ${{ steps.release_gate.outputs.release_sha }}

    steps:
      - name: Check out tagged source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the current verified and validated main commit
        id: release_gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git fetch --no-tags origin main
          release_sha="$(git rev-parse HEAD)"
          test "$release_sha" = "$(git rev-parse origin/main)"
          verified="$(gh api "repos/$GITHUB_REPOSITORY/commits/$release_sha" --jq '.commit.verification.verified')"
          test "$verified" = "true"
          for workflow in python-compat platform-compat agent-compat; do
            successful_runs="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow.yml/runs?head_sha=$release_sha&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main" and .conclusion == "success")] | length')"
            test "$successful_runs" -ge 1
          done
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Java for generated-fragment compile checks
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install release tooling and editable package
        run: python -m pip install --disable-pip-version-check -e ".[dev,inverse-design,comsol]"

      - name: Require tag and package versions to match
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(python -c 'from photonic_workflow import __version__; print(__version__)')"
          test "$tag_version" = "$package_version"

      - name: Re-run the solver-free release suite
        run: |
          python -B -m pytest
          python -B scripts/update_contract_surface_snapshot.py
          python -B scripts/test_photonic_assembly.py
          python -B scripts/test_numeric_tools.py
          python -B scripts/test_mcp_photonic_server.py
          python -B scripts/test_skill_metadata.py

      - name: Build and inspect distributions
        run: |
          python -m build
          python -B scripts/test_distribution_contents.py dist

      - name: Create deterministic SHA-256 inventory
        shell: bash
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS

      - name: Upload immutable release inputs
        id: release_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          retention-days: 7

  attest:
    name: Attest exact uploaded release inputs
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Download exact immutable release inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.release_artifact_id }}
          merge-multiple: true
          path: dist

      - name: Verify downloaded release inventory
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 3
          test -f dist/SHA256SUMS
          cd dist
          sha256sum --check SHA256SUMS

      - name: Generate GitHub build-provenance attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS

  publish:
    name: Publish the attested immutable release inputs
    needs:
      - build
      - attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download exact attested release inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.release_artifact_id }}
          merge-multiple: true
          path: dist

      - name: Recheck release refs, validation, and asset inventory
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
        shell: bash
        run: |
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq '.sha')"
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test "$tag_sha" = "$RELEASE_SHA"
          test "$main_sha" = "$RELEASE_SHA"
          verified="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA" --jq '.commit.verification.verified')"
          test "$verified" = "true"
          for workflow in python-compat platform-compat agent-compat; do
            successful_runs="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow.yml/runs?head_sha=$RELEASE_SHA&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main" and .conclusion == "success")] | length')"
            test "$successful_runs" -ge 1
          done
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 3
          test -f dist/SHA256SUMS
          cd dist
          sha256sum --check SHA256SUMS

      - name: Publish prerelease with attested assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease
